<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Law Casebook — Interactive Tools</title>
  <link rel="stylesheet" href="shared/css/base.css">
  <style>
    .tool-grid {
      max-width: 820px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .tool-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem 1.75rem;
      text-decoration: none;
      color: var(--text);
      display: block;
      transition: box-shadow 0.15s;
    }
    .tool-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .tool-card h2 { font-size: 1.1rem; color: var(--navy); margin-bottom: 0.4rem; }
    .tool-card p  { font-size: 0.9rem; color: var(--muted); line-height: 1.5; font-family: sans-serif; }
    .intro {
      max-width: 820px;
      margin: 2.5rem auto 0;
      padding: 0 1.5rem;
    }
    .intro p { font-size: 1rem; line-height: 1.7; color: #444; }
  </style>
</head>
<body>

<header>
  <h1>AI Law Casebook — <span>Interactive Tools</span></h1>
  <p class="byline">by <a href="https://www.paulohm.com/">Paul Ohm</a></p>
</header>

<div class="intro">
  <p>Companion tools for <em>AI Law</em>. Each demo runs entirely in your browser — no installation required.</p>
</div>

<div class="tool-grid">
  <a class="tool-card" href="wordvectors/">
    <h2>Word Vectors &amp; Bias</h2>
    <p>Explore how word embedding models encode human biases using vector arithmetic. Type three words; the model finds the fourth.</p>
  </a>
</div>

</body>
</html>
